<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podio - Variables al azar S3E</title>
    <style>
        :root {
            --bg: #1A1A2E;
            --surface: #16213E;
            --gold: #F39C12;
            --snake: #00FF66;
            --cyan: #00FFFF;
            --magenta: #FF00FF;
            --yellow: #FFE600;
            --green: #39FF14;
            --text: #F7FBFF;
            --muted: #A7B0C8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            background:
                linear-gradient(rgba(255, 230, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                var(--bg);
            background-size: 42px 42px;
            color: var(--text);
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            width: min(920px, calc(100vw - 28px));
            padding: clamp(24px, 5vw, 46px);
            background: rgba(22, 33, 62, 0.92);
            border: 2px solid var(--gold);
            border-radius: 8px;
            box-shadow: 0 0 28px rgba(243, 156, 18, 0.45), inset 0 0 22px rgba(0, 255, 255, 0.12);
        }

        h1 {
            margin: 0 0 24px;
            font-family: Impact, "Arial Black", sans-serif;
            font-size: clamp(2.4rem, 8vw, 5.8rem);
            line-height: 0.95;
            letter-spacing: 0;
            text-align: center;
            text-transform: uppercase;
            color: var(--yellow);
            text-shadow: 3px 0 0 var(--magenta), -3px 0 0 var(--cyan), 0 0 18px rgba(255, 230, 0, 0.6);
        }

        .ranking {
            display: grid;
            gap: 12px;
            margin-bottom: 28px;
        }

        .rank-row {
            display: grid;
            grid-template-columns: 64px 74px 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: #101A35;
        }

        .rank-row:first-child {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.42);
        }

        .place {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 2rem;
            color: var(--yellow);
            text-align: center;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border: 3px solid currentColor;
            border-radius: 50%;
            overflow: hidden;
            background: #0B1228;
            box-shadow: 0 0 14px currentColor;
        }

        .avatar svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .name {
            min-width: 0;
        }

        .name strong {
            display: block;
            font-size: 1.25rem;
            overflow-wrap: anywhere;
        }

        .name span {
            color: var(--muted);
        }

        .score {
            color: var(--green);
            font-size: 1.25rem;
            font-weight: 900;
            white-space: nowrap;
        }

        button {
            width: 100%;
            min-height: 56px;
            padding: 12px 18px;
            border: 2px solid var(--green);
            border-radius: 8px;
            background: var(--green);
            color: #07111F;
            font: inherit;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(57, 255, 20, 0.45);
        }

        @media (max-width: 640px) {
            .rank-row {
                grid-template-columns: 48px 58px 1fr;
            }

            .score {
                grid-column: 3;
            }

            .avatar {
                width: 54px;
                height: 54px;
            }
        }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    <main>
        <h1>Podio final</h1>
        <div id="ranking" class="ranking"></div>
        <button id="new-game" type="button">Nueva partida</button>
    </main>

    <script>
        const PLAYER_COLORS = ["#00FFFF", "#FF00FF", "#FFE600", "#39FF14"];
        const ranking = document.getElementById("ranking");
        const canvas = document.getElementById("confetti");
        const context = canvas.getContext("2d");
        let pieces = [];

        function readPlayers() {
            try {
                const session = JSON.parse(localStorage.getItem("vae_session") || "null");
                if (session && Array.isArray(session.players)) return session.players;
            } catch (error) {
                return [];
            }
            return [];
        }

        function colorFor(player) {
            return PLAYER_COLORS[(player.id - 1) % PLAYER_COLORS.length];
        }

        function fallbackAvatar(player) {
            return `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${player.name}">
                <circle cx="40" cy="40" r="34" fill="${colorFor(player)}"/>
                <text x="40" y="50" text-anchor="middle" font-size="30" font-weight="900" fill="#07111F">${player.id}</text>
            </svg>`;
        }

        function renderRanking() {
            const players = readPlayers().sort((a, b) => (b.score || 0) - (a.score || 0));

            if (!players.length) {
                ranking.innerHTML = "<p>No hay resultados guardados.</p>";
                return;
            }

            ranking.innerHTML = "";
            players.forEach((player, index) => {
                const row = document.createElement("div");
                row.className = "rank-row";
                row.style.color = colorFor(player);
                row.innerHTML = `
                    <div class="place">#${index + 1}</div>
                    <div class="avatar">${player.avatar?.svg || fallbackAvatar(player)}</div>
                    <div class="name">
                        <strong>${player.name}</strong>
                        <span>Casilla final ${player.position || 1}</span>
                    </div>
                    <div class="score">${player.score || 0} pts</div>
                `;
                ranking.appendChild(row);
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            context.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }

        function createConfetti() {
            const colors = ["#00FFFF", "#FF00FF", "#FFE600", "#39FF14", "#F39C12", "#00FF66"];
            pieces = Array.from({ length: 160 }, () => ({
                x: Math.random() * window.innerWidth,
                y: Math.random() * -window.innerHeight,
                size: 5 + Math.random() * 8,
                speed: 2 + Math.random() * 4,
                drift: -1.5 + Math.random() * 3,
                rotation: Math.random() * Math.PI,
                color: colors[Math.floor(Math.random() * colors.length)]
            }));
        }

        function drawConfetti() {
            context.clearRect(0, 0, window.innerWidth, window.innerHeight);
            pieces.forEach(piece => {
                piece.y += piece.speed;
                piece.x += piece.drift;
                piece.rotation += 0.05;

                if (piece.y > window.innerHeight + 20) {
                    piece.y = -20;
                    piece.x = Math.random() * window.innerWidth;
                }

                context.save();
                context.translate(piece.x, piece.y);
                context.rotate(piece.rotation);
                context.fillStyle = piece.color;
                context.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size * 0.62);
                context.restore();
            });
            requestAnimationFrame(drawConfetti);
        }

        document.getElementById("new-game").addEventListener("click", () => {
            localStorage.removeItem("vae_session");
            localStorage.removeItem("vae_difficulty");
            window.location.href = "index.html";
        });

        window.addEventListener("resize", () => {
            resizeCanvas();
            createConfetti();
        });

        renderRanking();
        resizeCanvas();
        createConfetti();
        drawConfetti();
    </script>
</body>
</html>
