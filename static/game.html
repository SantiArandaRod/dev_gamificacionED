<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&E: Ecuaciones Diferenciales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #1a1a2e;
            --sidebar-bg: #16213e;
            --board-bg: #0f3460;
            --accent: #4ecca3;
            --danger: #e94560;
        }

        body {
            background: var(--primary-bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        /* --- CONTENEDOR DEL TABLERO (5x5 CUADRADO) --- */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            background: var(--board-bg);
            padding: 20px;
            border-radius: 15px;
            border: 4px solid var(--accent);
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(78, 204, 163, 0.15);
        }

        /* --- CELDAS --- */
        .cell {
            background: var(--sidebar-bg);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.2s, background 0.3s;
        }

        .cell span {
            position: absolute;
            top: 8px;
            left: 10px;
            color: var(--accent);
            font-weight: bold;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* --- CASILLAS ESPECIALES --- */
        .snake_head {
            border: 2px dashed var(--danger);
            background: rgba(233, 69, 96, 0.1);
        }
        .ladder_bottom {
            border: 2px dashed var(--accent);
            background: rgba(78, 204, 163, 0.1);
        }
        .question {
            cursor: pointer;
            background: linear-gradient(145deg, #16213e, #1a1a2e);
        }
        .question:hover {
            background: #1f2a44;
            transform: scale(1.02);
        }

        /* --- AVATAR / FICHA --- */
        .player-token {
            width: 85%;
            height: 85%;
            z-index: 10;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent !important;
        }

        .player-token svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            animation: float 3s ease-in-out infinite;
        }

        .player-token:active { cursor: grabbing; }

        .token-move svg {
            animation: token-hop 0.7s ease both;
        }

        .token-correct svg {
            animation: token-correct 0.9s ease both;
            filter: drop-shadow(0 0 12px rgba(78, 204, 163, 0.85));
        }

        .token-incorrect svg {
            animation: token-incorrect 0.8s ease both;
            filter: drop-shadow(0 0 12px rgba(233, 69, 96, 0.85));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        @keyframes token-hop {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-18px) scale(1.08); }
            100% { transform: translateY(0) scale(1); }
        }

        @keyframes token-correct {
            0% { transform: scale(1); }
            45% { transform: scale(1.16) rotate(-3deg); }
            100% { transform: scale(1); }
        }

        @keyframes token-incorrect {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background: var(--sidebar-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--accent);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #dice-value {
            font-family: 'Courier New', Courier, monospace;
            background: var(--primary-bg) !important;
            color: var(--accent) !important;
            border: 3px solid var(--accent) !important;
            text-shadow: 0 0 10px var(--accent);
            font-weight: bold;
        }

        .dice-pop {
            animation: dice-pop 0.42s ease both;
        }

        @keyframes dice-pop {
            0% { transform: scale(0.88) rotate(-5deg); }
            60% { transform: scale(1.08) rotate(3deg); }
            100% { transform: scale(1) rotate(0); }
        }

        /* --- MODAL --- */
        .modal-content {
            background: var(--sidebar-bg);
            border: 2px solid var(--accent);
            border-radius: 15px;
        }

        .btn-option {
            transition: all 0.2s;
            border: 1px solid var(--accent);
            color: white;
        }

        .btn-option:hover {
            background: var(--accent);
            color: var(--primary-bg);
            font-weight: bold;
        }

        .question-feedback {
            min-height: 0;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            border-radius: 8px;
            padding: 0;
            font-weight: 700;
        }

        .question-feedback.show {
            opacity: 1;
            transform: translateY(0);
            margin-top: 18px;
            padding: 12px 14px;
        }

        .question-feedback.correct {
            background: rgba(78, 204, 163, 0.16);
            color: #8ef0cf;
            border: 1px solid rgba(78, 204, 163, 0.55);
        }

        .question-feedback.incorrect {
            background: rgba(233, 69, 96, 0.16);
            color: #ff9bad;
            border: 1px solid rgba(233, 69, 96, 0.55);
        }

        .question-feedback.neutral {
            background: rgba(255, 193, 7, 0.16);
            color: #ffe08a;
            border: 1px solid rgba(255, 193, 7, 0.5);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.04);
        }

        .score-row.active {
            outline: 1px solid rgba(78, 204, 163, 0.72);
            background: rgba(78, 204, 163, 0.12);
        }

        #game-notice {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 12px);
            z-index: 1200;
            max-width: min(560px, calc(100vw - 32px));
            background: #10192f;
            border: 1px solid rgba(78, 204, 163, 0.55);
            color: #f7fbff;
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        #game-notice.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

    <div class="container-fluid p-4">
        <div class="row g-4 align-items-center justify-content-center">

            <div class="col-xl-6 col-lg-7 d-flex justify-content-center">
                <div id="board" class="board-grid">
                    </div>
            </div>

            <div class="col-xl-4 col-lg-5">
                <div class="sidebar">
                    <h2 class="text-center mb-4" style="color: var(--accent); letter-spacing: 2px;">PANEL DE JUEGO</h2>

                    <div class="text-center mb-4">
                        <div id="dice-value" class="display-1 mb-3 rounded d-flex align-items-center justify-content-center"
                             style="width: 120px; height: 120px; margin: 0 auto;">?</div>
                        <button id="btn-roll" class="btn btn-lg btn-warning fw-bold w-100 py-3 shadow">
                            LANZAR DADO
                        </button>
                    </div>

                    <div class="card bg-dark border-info mb-4">
                        <div class="card-body text-info small">
                            <h6 class="card-title fw-bold">Misión Actual:</h6>
                            Lanza el dado. Si caes en una casilla de pregunta, resuelve el reto para mantener tu posición.
                        </div>
                    </div>

                    <button onclick="location.href='index.html'" class="btn btn-outline-danger w-100">Salir</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="qModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 justify-content-center">
                    <h5 class="modal-title text-info">RETO ACADÉMICO</h5>
                </div>
                <div class="modal-body text-center p-4">
                    <h4 id="q-text" class="mb-4 fw-light"></h4>
                    <div id="q-options" class="d-grid gap-3">
                        </div>
                    <div id="q-feedback" class="question-feedback"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-notice" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/avatar-builder.js?v=avatar-colors-2"></script> <script src="js/question-modal.js"></script>
    <script src="js/board.js"></script>
</body>
</html>
