<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables al azar - S3E</title>
    <style>
        :root {
            --bg: #1A1A2E;
            --surface: #16213E;
            --gold: #F39C12;
            --snake: #00FF66;
            --cyan: #00FFFF;
            --magenta: #FF00FF;
            --yellow: #FFE600;
            --green: #39FF14;
            --text: #F7FBFF;
            --muted: #A7B0C8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                linear-gradient(rgba(0, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.05) 1px, transparent 1px),
                var(--bg);
            background-size: 44px 44px;
            color: var(--text);
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.04),
                rgba(255, 255, 255, 0.04) 1px,
                transparent 1px,
                transparent 4px
            );
            mix-blend-mode: overlay;
        }

        main {
            width: min(920px, calc(100vw - 32px));
            padding: clamp(28px, 6vw, 64px);
            text-align: center;
            background: rgba(22, 33, 62, 0.78);
            border: 2px solid var(--cyan);
            border-radius: 8px;
            box-shadow:
                0 0 18px rgba(0, 255, 255, 0.58),
                inset 0 0 24px rgba(255, 0, 255, 0.16);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            margin-bottom: 22px;
            padding: 7px 14px;
            border: 1px solid var(--gold);
            color: var(--yellow);
            text-transform: uppercase;
            letter-spacing: 0;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.8);
        }

        h1 {
            margin: 0;
            font-family: Impact, "Arial Black", sans-serif;
            font-size: clamp(2.5rem, 9vw, 6.8rem);
            line-height: 0.92;
            letter-spacing: 0;
            text-transform: uppercase;
            color: var(--text);
            text-shadow:
                4px 0 0 var(--magenta),
                -4px 0 0 var(--cyan),
                0 0 22px rgba(0, 255, 102, 0.42);
            animation: title-in 900ms cubic-bezier(.2,.9,.2,1) both, glitch 3.2s 1.1s infinite;
        }

        .subtitle {
            max-width: 620px;
            margin: 24px auto 34px;
            color: var(--muted);
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            line-height: 1.5;
        }

        .play-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 210px;
            min-height: 58px;
            padding: 14px 28px;
            border: 2px solid var(--green);
            border-radius: 8px;
            background: #0B1228;
            color: var(--green);
            font-size: 1.25rem;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(57, 255, 20, 0.55);
            transition: transform 180ms ease, background 180ms ease, color 180ms ease;
        }

        .play-button:hover,
        .play-button:focus-visible {
            transform: translateY(-2px) scale(1.03);
            background: var(--green);
            color: #07111F;
            outline: none;
        }

        .arcade-track {
            width: min(560px, 90%);
            height: 8px;
            margin: 32px auto 0;
            background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--yellow), var(--snake));
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.38);
            animation: track-pulse 1.4s ease-in-out infinite;
        }

        @keyframes title-in {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.92);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes glitch {
            0%, 92%, 100% { transform: translateX(0); }
            94% { transform: translateX(-3px); }
            96% { transform: translateX(3px); }
            98% { transform: translateX(-1px); }
        }

        @keyframes track-pulse {
            0%, 100% { opacity: 0.75; transform: scaleX(0.94); }
            50% { opacity: 1; transform: scaleX(1); }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <main>
        <div class="badge">Serpientes, escaleras y ecuaciones</div>
        <h1>Variables al azar - S3E</h1>
        <p class="subtitle">
            Una partida local para resolver retos de Ecuaciones Diferenciales con dados,
            avatares y decisiones honestas.
        </p>
        <a class="play-button" href="rules.html">Jugar</a>
        <div class="arcade-track" aria-hidden="true"></div>
    </main>
</body>
</html>
