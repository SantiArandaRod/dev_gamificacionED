<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reglas - Variables al azar S3E</title>
    <style>
        :root {
            --bg: #1A1A2E;
            --surface: #16213E;
            --gold: #F39C12;
            --snake: #00FF66;
            --cyan: #00FFFF;
            --magenta: #FF00FF;
            --yellow: #FFE600;
            --green: #39FF14;
            --text: #F7FBFF;
            --muted: #A7B0C8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 10%, rgba(0, 255, 255, 0.12), transparent 34%),
                var(--bg);
            color: var(--text);
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        main {
            width: min(760px, calc(100vw - 32px));
            padding: clamp(24px, 5vw, 46px);
            background: var(--surface);
            border: 2px solid var(--magenta);
            border-radius: 8px;
            box-shadow: 0 0 22px rgba(255, 0, 255, 0.45), inset 0 0 22px rgba(0, 255, 255, 0.1);
        }

        h1 {
            margin: 0 0 24px;
            font-family: Impact, "Arial Black", sans-serif;
            font-size: clamp(2rem, 7vw, 4.7rem);
            line-height: 0.95;
            letter-spacing: 0;
            text-transform: uppercase;
            color: var(--yellow);
            text-shadow: 0 0 18px rgba(255, 230, 0, 0.65);
        }

        .rule {
            margin: 0 0 34px;
            padding: 22px;
            border: 2px solid var(--green);
            border-radius: 8px;
            background: #101A35;
            color: var(--text);
            font-size: clamp(1.35rem, 4vw, 2.1rem);
            font-weight: 900;
            text-align: center;
            box-shadow: 0 0 18px rgba(57, 255, 20, 0.38);
        }

        .selector-title {
            margin: 0 0 14px;
            color: var(--cyan);
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .difficulty-option {
            min-height: 112px;
            border: 2px solid rgba(0, 255, 255, 0.35);
            border-radius: 8px;
            background: #0B1228;
            color: var(--text);
            cursor: pointer;
            box-shadow: inset 0 0 16px rgba(0, 255, 255, 0.08);
            transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        .difficulty-option strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1.25rem;
            color: var(--text);
        }

        .difficulty-option span {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .difficulty-option.active {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        a,
        button {
            min-height: 52px;
            padding: 12px 18px;
            border-radius: 8px;
            font: inherit;
            font-weight: 900;
            text-transform: uppercase;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            text-decoration: none;
            background: transparent;
        }

        button {
            border: 2px solid var(--green);
            color: #07111F;
            background: var(--green);
            cursor: pointer;
            box-shadow: 0 0 16px rgba(57, 255, 20, 0.45);
        }

        @media (max-width: 680px) {
            .difficulty-grid,
            .actions {
                grid-template-columns: 1fr;
                flex-direction: column;
            }

            .actions > * {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Reglas y dificultad</h1>
        <p class="rule">Disfrutar y ser Honesto</p>

        <p class="selector-title">Selecciona el corte academico</p>
        <div class="difficulty-grid" role="radiogroup" aria-label="Dificultad">
            <button class="difficulty-option active" type="button" data-difficulty="easy" aria-pressed="true">
                <strong>Facil</strong>
                <span>Corte 1</span>
            </button>
            <button class="difficulty-option" type="button" data-difficulty="medium" aria-pressed="false">
                <strong>Medio</strong>
                <span>Corte 2</span>
            </button>
            <button class="difficulty-option" type="button" data-difficulty="hard" aria-pressed="false">
                <strong>Dificil</strong>
                <span>Corte 3</span>
            </button>
        </div>

        <div class="actions">
            <a href="index.html">Volver</a>
            <button id="continue-button" type="button">Continuar</button>
        </div>
    </main>

    <script>
        const options = Array.from(document.querySelectorAll(".difficulty-option"));
        const storedDifficulty = localStorage.getItem("vae_difficulty") || "easy";
        let selectedDifficulty = storedDifficulty;

        function renderSelection() {
            options.forEach(option => {
                const active = option.dataset.difficulty === selectedDifficulty;
                option.classList.toggle("active", active);
                option.setAttribute("aria-pressed", String(active));
            });
        }

        options.forEach(option => {
            option.addEventListener("click", () => {
                selectedDifficulty = option.dataset.difficulty;
                renderSelection();
            });
        });

        document.getElementById("continue-button").addEventListener("click", () => {
            localStorage.setItem("vae_difficulty", selectedDifficulty);
            window.location.href = "players.html";
        });

        renderSelection();
    </script>
</body>
</html>
